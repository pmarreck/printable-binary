<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintableBinary Encoder/Decoder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      color: #333;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    main {
      padding: 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .dropzone {
      border: 3px dashed #667eea;
      border-radius: 12px;
      padding: 3rem;
      text-align: center;
      background: #f8f9ff;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .dropzone:hover {
      border-color: #764ba2;
      background: #f0f2ff;
      transform: translateY(-2px);
    }

    .dropzone.dragover {
      border-color: #764ba2;
      background: #e8ebff;
      transform: scale(1.02);
    }

    .dropzone-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .dropzone-text {
      font-size: 1.2rem;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .dropzone-subtext {
      font-size: 0.9rem;
      color: #666;
    }

    .file-info {
      margin-top: 1rem;
      padding: 1rem;
      background: #e8f4f8;
      border-radius: 8px;
      display: none;
    }

    .file-info.visible {
      display: block;
    }

    .file-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .file-size {
      font-size: 0.9rem;
      color: #666;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
      display: none;
    }

    .progress-bar.visible {
      display: block;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    .output-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .output-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
    }

    .stats {
      font-size: 0.9rem;
      color: #666;
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 300px;
      padding: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    footer {
      padding: 1.5rem 2rem;
      background: #f8f9fa;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }

    footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .dropzone {
        padding: 2rem 1rem;
      }

      .dropzone-icon {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PrintableBinary Encoder/Decoder</h1>
      <p class="subtitle">Encode binary files into human-readable UTF-8 text</p>
    </header>

    <main>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" style="display: none;" accept="*/*">
        <div class="dropzone-icon">📁</div>
        <div class="dropzone-text">Drop a file here or click to browse</div>
        <div class="dropzone-subtext">Supports files up to 2GB</div>
        <div class="file-info" id="fileInfo">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <div class="output-section">
        <div class="output-header">
          <div>
            <span class="output-label" id="outputLabel">Encoded Output</span>
            <span class="stats" id="stats"></span>
          </div>
          <div class="button-group">
            <button id="copyBtn" disabled>Copy to Clipboard</button>
            <button id="downloadBtn" disabled>Download</button>
            <button id="clearBtn" disabled>Clear</button>
          </div>
        </div>
        <textarea id="output" placeholder="Encoded output will appear here..." readonly></textarea>
        <div class="error-message" id="errorMessage"></div>
      </div>
    </main>

    <footer>
      <p>
        Part of the <a href="https://github.com/pmarreck/printable-binary" target="_blank">PrintableBinary</a> project
        | <a href="https://github.com/pmarreck/printable-binary/blob/main/README.md" target="_blank">Documentation</a>
      </p>
    </footer>
  </div>

  <script type="module">
    import PrintableBinary from './printable_binary.js';

    // Initialize the encoder
    const encoder = new PrintableBinary();

    // DOM elements
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const output = document.getElementById('output');
    const stats = document.getElementById('stats');
    const outputLabel = document.getElementById('outputLabel');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const errorMessage = document.getElementById('errorMessage');

    const MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024; // 2GB

    // Format file size
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
    }

    // Show error
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      setTimeout(() => {
        errorMessage.classList.remove('visible');
      }, 5000);
    }

    // Update progress
    function updateProgress(percent) {
      progressBar.classList.add('visible');
      progressFill.style.width = percent + '%';
      if (percent >= 100) {
        setTimeout(() => {
          progressBar.classList.remove('visible');
          progressFill.style.width = '0%';
        }, 1000);
      }
    }

    // Process file in chunks for large files
    async function processFileInChunks(file, formatSpec) {
      const chunkSize = 1024 * 1024; // 1MB chunks
      const chunks = Math.ceil(file.size / chunkSize);
      let offset = 0;
      const results = [];

      for (let i = 0; i < chunks; i++) {
        const chunk = file.slice(offset, offset + chunkSize);
        const arrayBuffer = await chunk.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);
        // Don't format individual chunks - we'll format the final result
        const encoded = encoder.encode(uint8Array);
        results.push(encoded);

        offset += chunkSize;
        updateProgress(Math.round(((i + 1) / chunks) * 100));
      }

      const combined = results.join('');

      // Apply formatting to the complete output if specified
      if (formatSpec) {
        return encoder.formatOutput(combined, formatSpec);
      }

      return combined;
    }

    // Handle file selection
    async function handleFile(file) {
      if (!file) return;

      // Validate file size
      if (file.size > MAX_FILE_SIZE) {
        showError(`File is too large. Maximum size is ${formatFileSize(MAX_FILE_SIZE)}.`);
        return;
      }

      // Show file info
      fileName.textContent = `File: ${file.name}`;
      fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
      fileInfo.classList.add('visible');

      // Clear previous output
      output.value = '';
      stats.textContent = '';

      try {
        const isPbtFile = file.name && file.name.toLowerCase().endsWith('.pbt');
        const startTime = performance.now();

        if (isPbtFile) {
          outputLabel.textContent = 'Decoded Output';
          updateProgress(10);
          const encodedText = await file.text();
          updateProgress(40);

          const decodedBytes = encoder.decode(encodedText);
          updateProgress(100);

          const endTime = performance.now();
          const duration = ((endTime - startTime) / 1000).toFixed(2);

          output.value = '';
          output.placeholder = `Decoded binary is ${formatFileSize(decodedBytes.length)}. Use Download to save it.`;
          stats.textContent = ` (${formatFileSize(file.size)} .pbt → ${formatFileSize(decodedBytes.length)} in ${duration}s)`;

          copyBtn.disabled = true;
          copyBtn.payload = null;

          downloadBtn.disabled = false;
          clearBtn.disabled = false;

          const decodedName = file.name.replace(/\.pbt$/i, '') || 'decoded.bin';
          downloadBtn.payload = {
            bytes: decodedBytes,
            filename: decodedName,
            mime: 'application/octet-stream'
          };
        } else {
          outputLabel.textContent = 'Encoded Output';
          // Use 75x1 format (75 chars per line, 1 group per line) for better textarea performance
          const formatSpec = '75x1';

          let encodedOutput;
          if (file.size > 10 * 1024 * 1024) { // > 10MB, use chunked processing
            encodedOutput = await processFileInChunks(file, formatSpec);
          } else {
            updateProgress(50);
            const arrayBuffer = await file.arrayBuffer();
            encodedOutput = encoder.encode(arrayBuffer, { format: formatSpec });
            updateProgress(100);
          }

          const endTime = performance.now();
          const duration = ((endTime - startTime) / 1000).toFixed(2);

          const utf8Encoder = new TextEncoder();
          const encodedByteArray = utf8Encoder.encode(encodedOutput);
          const encodedBytes = encodedByteArray.length;

          if (encodedBytes < 1024 * 1024) {
            output.value = encodedOutput;
            output.placeholder = "Encoded output will appear here...";
          } else {
            output.value = '';
            output.placeholder = `Encoded output is ${formatFileSize(encodedBytes)} - too large to display. Use Download or Copy buttons.`;
          }

          stats.textContent = ` (${formatFileSize(file.size)} → ${formatFileSize(encodedBytes)} in ${duration}s)`;

          copyBtn.disabled = false;
          copyBtn.payload = encodedOutput;
          downloadBtn.disabled = false;
          clearBtn.disabled = false;

          const baseName = file.name || 'encoded';
          const downloadName = baseName.toLowerCase().endsWith('.pbt') ? baseName : `${baseName}.pbt`;
          downloadBtn.payload = {
            bytes: encodedByteArray,
            fallbackText: encodedOutput,
            filename: downloadName,
            mime: 'text/plain;charset=utf-8'
          };
        }

      } catch (error) {
        showError(`Error processing file: ${error.message}`);
        console.error(error);
      }
    }

    // Dropzone click to browse
    dropzone.addEventListener('click', () => {
      fileInput.click();
    });

    // File input change
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      handleFile(file);
    });

    // Drag and drop
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      handleFile(file);
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', async () => {
      try {
        // Use stored data if available, otherwise fall back to textarea value
        const textToCopy = copyBtn.payload ?? output.value;
        if (!textToCopy) {
          showError('No encoded text available to copy.');
          return;
        }
        await navigator.clipboard.writeText(textToCopy);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✓ Copied!';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      } catch (error) {
        showError('Failed to copy to clipboard');
      }
    });

    // Download encoded file
    downloadBtn.addEventListener('click', () => {
      // Use stored data if available, otherwise fall back to textarea value
      const payload = downloadBtn.payload;
      if (!payload) {
        showError('No data available to download yet.');
        return;
      }

      let blobParts = null;

      if (payload.bytes !== undefined) {
        blobParts = [payload.bytes instanceof Uint8Array ? payload.bytes : new Uint8Array(payload.bytes)];
      } else if (payload.fallbackText) {
        blobParts = [payload.fallbackText];
      }

      if (!blobParts) {
        showError('No data available to download yet.');
        return;
      }

      const blob = new Blob(blobParts, { type: payload.mime || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const defaultName = fileName.textContent.replace('File: ', '') || 'output.bin';
      a.download = payload.filename || defaultName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Clear output
    clearBtn.addEventListener('click', () => {
      output.value = '';
      stats.textContent = '';
      fileInfo.classList.remove('visible');
      fileInput.value = '';
      copyBtn.disabled = true;
      downloadBtn.disabled = true;
      clearBtn.disabled = true;
      outputLabel.textContent = 'Encoded Output';
      delete downloadBtn.payload;
      delete copyBtn.payload;
    });

    // Prevent default drag/drop on the document
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());
  </script>
</body>
</html>
